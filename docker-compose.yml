version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ecommerce
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Queue
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Laravel Backend (Port 8000)
  backend-laravel:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: ecommerce_backend_laravel
    ports:
      - "8000:8000"
    volumes:
      - ./backend-laravel:/var/www/html
      - backend_laravel_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ecommerce
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Laravel Queue Worker
  queue_worker_laravel:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: ecommerce_queue_worker_laravel
    volumes:
      - ./backend-laravel:/var/www/html
      - backend_laravel_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ecommerce
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_network
    command: php artisan queue:work --verbose --tries=3 --timeout=90

  # Symfony Backend (Port 8001)
  backend-symfony:
    build:
      context: ./backend-symfony
      dockerfile: Dockerfile
    container_name: ecommerce_backend_symfony
    ports:
      - "8001:8001"
    volumes:
      - ./backend-symfony:/app
      - backend_symfony_vendor:/app/vendor
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
      - DATABASE_URL=mysql://root:secret@mysql:3306/ecommerce?serverVersion=8.0
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOW_ORIGIN=^http://localhost:3000$
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_network
    command: symfony server:start --port=8001 --no-tls

  # Next.js v16 Frontend
  frontend-nextjs-v16:
    build:
      context: ./frontend-nextjs-v16
      dockerfile: Dockerfile
    container_name: ecommerce_frontend_nextjs_v16
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-nextjs-v16:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend-laravel
    networks:
      - ecommerce_network
    command: npm run dev

networks:
  ecommerce_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_laravel_vendor:
  backend_symfony_vendor:
  frontend_node_modules:
