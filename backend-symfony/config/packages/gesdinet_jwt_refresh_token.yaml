# Gesdinet JWT Refresh Token Bundle Configuration
gesdinet_jwt_refresh_token:
    # Refresh token TTL (30 days)
    ttl: 2592000

    # Automatically update refresh token on usage
    ttl_update: true

    # Firewall name
    firewall: api

    # User provider
    user_provider: security.user.provider.concrete.app_user_provider

    # User identity field
    user_identity_field: email

    # Token parameter name in request
    token_parameter_name: refresh_token

    # Single use tokens (delete after usage and create new one)
    single_use: false

    # Doctrine entity manager
    manager_type: orm

    # Custom refresh token class
    refresh_token_class: App\Entity\RefreshToken

    # Return expiration timestamp in response
    return_expiration: true

    # Return expiration as DateTime object
    return_expiration_parameter_name: refresh_token_expiration
