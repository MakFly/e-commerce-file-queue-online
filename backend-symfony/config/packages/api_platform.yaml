api_platform:
    title: 'E-Commerce API'
    version: '1.0.0'
    description: 'E-Commerce API with Queue Management'

    # Swagger UI
    swagger:
        versions: [3]
        api_keys:
            apiKey:
                name: Authorization
                type: header

    # Formats
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']

    # Defaults for API resources
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Accept-Language']
        extra_properties:
            standard_put: true
            rfc_7807_compliant_errors: true

    # Pagination
    collection:
        pagination:
            enabled: true
            client_enabled: true
            client_items_per_page: true
            items_per_page: 30
            maximum_items_per_page: 100

    # Exception to status codes
    exception_to_status:
        Symfony\Component\Serializer\Exception\ExceptionInterface: 400
        ApiPlatform\Exception\InvalidArgumentException: 400
        Doctrine\ORM\OptimisticLockException: 409

    # Eager loading
    eager_loading:
        enabled: true

when@dev:
    api_platform:
        # Show the error details in dev
        show_webby: true
