framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true

    cache:
        app: cache.adapter.filesystem
        # Use Redis cache in production by uncommenting:
        # app: cache.adapter.redis
        # default_redis_provider: '%env(REDIS_URL)%'

    # Session is disabled for stateless API (using JWT)
    # Uncomment if you need session support
    # session:
    #     handler_id: null
    #     cookie_secure: auto
    #     cookie_samesite: lax

    # Enable trusted hosts
    trusted_hosts: ~

    # Enable trusted proxies
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
