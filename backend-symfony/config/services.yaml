services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Redis Service
    App\Service\RedisService:
        arguments:
            $redisUrl: '%env(REDIS_URL)%'

    # Queue Service
    App\Service\QueueService:
        arguments:
            $maxConcurrentUsers: '%env(int:QUEUE_MAX_CONCURRENT_USERS)%'
            $queueEnabled: '%env(bool:QUEUE_ENABLED)%'

    # Controllers
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # JWT Event Listener - Add refresh token to login response
    App\EventListener\JWTCreatedListener:
        arguments:
            $ttl: 2592000  # 30 days
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccessResponse }

    # API Logger - Inject the 'api' channel
    App\EventListener\ApiLoggerListener:
        arguments:
            $apiLogger: '@monolog.logger.api'
